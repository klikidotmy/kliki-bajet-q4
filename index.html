<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KLIKI Bajet Q4</title>
<meta name="description" content="Jejak belanja marketing Q4 KLIKI, leads dan walk-in ikut outlet, terus dari sheet.">
<meta name="theme-color" content="#046ad8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bajet Q4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <img src="icons/logo-white.png" alt="KLIKI" class="logo">
  <div class="top-meta">
    <span id="updated">Belum sync</span>
    <button id="btnRefresh" class="icon-btn" aria-label="Refresh"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
  </div>
</header>

<main id="app">
  <section id="view-home" class="view"></section>
  <section id="view-add" class="view" hidden></section>
  <section id="view-log" class="view" hidden></section>
  <section id="view-check" class="view" hidden></section>
  <section id="view-banner" class="view" hidden></section>
</main>

<nav class="tabs" aria-label="Menu">
  <button data-view="home" class="active"><span class="ti"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg></span>Ringkasan</button>
  <button data-view="log"><span class="ti"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span>Log</button>
  <button data-view="add" class="add"><span class="ti"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></span>Tambah</button>
  <button data-view="check"><span class="ti"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/></svg></span>Checklist</button>
  <button data-view="banner"><span class="ti"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="12" x="2" y="6" rx="2"/><path d="M6 18v3M18 18v3"/></svg></span>Banner</button>
</nav>

<div id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
